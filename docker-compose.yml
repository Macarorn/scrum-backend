services:
  # ============================================
  # Base de datos MySQL
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: scrum-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456789}
      MYSQL_DATABASE: ${DB_NAME:-scrum_db}
    ports:
      - "3307:3306"  # 3307 externo para no chocar con MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scrum_db_schema_actualizado_Version4.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-123456789}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - scrum-network

  # ============================================
  # Backend API
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrum-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Base de datos - apunta al servicio mysql dentro de Docker
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-123456789}
      DB_NAME: ${DB_NAME:-scrum_db}
      DB_PORT: 3306
      # Servidor
      PORT: 3000
      NODE_ENV: production
      # JWT
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_key}
      JWT_EXPIRE: ${JWT_EXPIRE:-1h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-jwt_refresh_secret_key}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      # CORS - ajusta al dominio de tu frontend en producción
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Rate Limiting
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-15}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scrum-network

volumes:
  mysql_data:
    driver: local

networks:
  scrum-network:
    driver: bridge
